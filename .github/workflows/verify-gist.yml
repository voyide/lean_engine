name: Lean Verifier Webhook
on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'The ID of the Gist to verify'
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Get Mathlib Cache
        run: |
          lake exe cache get

      - name: Download Gist
        run: |
          gh gist clone ${{ github.event.inputs.gist_id }} gist_repo
          LEAN_FILE=$(ls gist_repo/*.lean | head -n 1)
          cp "$LEAN_FILE" ./LeanEngine.lean
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Proof and Capture Output
        id: verify_step
        run: |
          if lake build > build_log.txt 2>&1; then
            echo "STATUS=✅ SUCCESS" >> $GITHUB_ENV
          else
            echo "STATUS=❌ FAILURE" >> $GITHUB_ENV
          fi
          
      - name: Comment on Gist
        if: always()
        run: |
          # Use jq to safely construct the JSON payload without bash quoting errors
          jq -n \
            --arg status "$STATUS" \
            --arg log "$(cat build_log.txt)" \
            '{body: ($status + "\n\n```text\n" + $log + "\n```")}' > payload.json
          
          # Send the comment to the Gist using GitHub's REST API
          curl -s -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/gists/${{ github.event.inputs.gist_id }}/comments \
            -d @payload.json
